# Development configuration: runs as an ordinary user.
#
# Differs from examples/elodin.yaml only in the two things that need root: it
# listens on 5354 instead of 53, and caches blocklists under the project
# directory instead of /var/cache. Use `mise run run` to start it.

log:
  level: debug
  queries: true

listeners:
  udp:
    enabled: true
    address: "127.0.0.1"
    port: 5354
  tcp:
    enabled: true
    address: "127.0.0.1"
    port: 5354
  # Run `mise run certs` first to enable these.
  dot:
    enabled: false
    address: "127.0.0.1"
    port: 8853
    cert_file: certs/cert.pem
    key_file: certs/key.pem
  doh:
    enabled: false
    address: "127.0.0.1"
    port: 8443
    path: /dns-query
    cert_file: certs/cert.pem
    key_file: certs/key.pem

upstream:
  strategy: round_robin # failover
  timeout: 5s
  bootstrap: [1.1.1.1, 9.9.9.9]
  servers:
    - name: cloudflare-dot
      type: tls
      address: 1.1.1.1
      port: 853
      hostname: cloudflare-dns.com
    - name: quad9-dot
      type: tls
      address: 9.9.9.9
      port: 853
      hostname: dns.quad9.net

cache:
  enabled: true
  max_entries: 10000

blocking:
  enabled: true
  response: nxdomain
  cache_dir: .cache/elodin
  refresh: 24h
  lists:
    - name: steven-black
      url: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
      format: hosts
  rules:
    - "||doubleclick.net^"

dnssec:
  # On, as it is by default. Worth watching work:
  #   dig +dnssec @127.0.0.1 -p 5354 www.example.com   # ad flag set
  #   dig +dnssec @127.0.0.1 -p 5354 dnssec-failed.org # SERVFAIL
  enabled: true

rewrites:
  - domain: nas.home
    answer: 192.168.1.50
