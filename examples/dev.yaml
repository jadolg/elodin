# Development configuration: runs as an ordinary user. Use `mise run run`.
#
# Two of the differences from examples/elodin.yaml are what makes it
# unprivileged: it listens on 5354 (and 8853 / 8443) instead of 53, 853 and 443,
# and it caches blocklists under the project directory instead of /var/cache.
# The rest are for developing against: it binds loopback rather than 0.0.0.0,
# logs at debug with a line per query, carries fewer blocklists so a start is
# quick, rotates upstreams so both get exercised, keeps one rewrite to look at,
# and turns the metrics endpoint on. Anything absent below is the shipped
# default; examples/elodin.yaml is where those are written out.

log:
  level: debug
  queries: true

listeners:
  udp:
    enabled: true
    address: "127.0.0.1"
    port: 5354
  tcp:
    enabled: true
    address: "127.0.0.1"
    port: 5354
  # Run `mise run certs` first to enable these.
  dot:
    enabled: false
    address: "127.0.0.1"
    port: 8853
    cert_file: certs/cert.pem
    key_file: certs/key.pem
  doh:
    enabled: false
    address: "127.0.0.1"
    port: 8443
    path: /dns-query
    cert_file: certs/cert.pem
    key_file: certs/key.pem

upstream:
  strategy: round_robin # failover
  timeout: 5s
  bootstrap: [1.1.1.1, 9.9.9.9]
  servers:
    - name: cloudflare-dot
      type: tls
      address: 1.1.1.1
      port: 853
      hostname: cloudflare-dns.com
    - name: quad9-dot
      type: tls
      address: 9.9.9.9
      port: 853
      hostname: dns.quad9.net

cache:
  enabled: true
  max_entries: 10000
  max_bytes: 64MiB

blocking:
  enabled: true
  response: nxdomain
  cache_dir: .cache/elodin
  refresh: 24h
  lists:
    - name: steven-black
      url: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
      format: hosts
    - name: android-tracking
      url: https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/android-tracking.txt
      format: domains
  rules:
    - "||doubleclick.net^"

dnssec:
  # On, as it is by default. Worth watching work:
  #   dig +dnssec @127.0.0.1 -p 5354 www.example.com   # ad flag set
  #   dig +dnssec @127.0.0.1 -p 5354 dnssec-failed.org # SERVFAIL
  enabled: true

rewrites:
  - domain: nas.home
    answer: 192.168.1.50

# Off by default; on here so `curl localhost:9153/metrics` works while
# developing.
metrics:
  enabled: true
  address: "127.0.0.1"
  port: 9153
  path: /metrics
