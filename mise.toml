[tools]
odin = "dev-2026-07"
# Odin shells out to `clang` as its linker driver. Pinning it here keeps the
# toolchain reproducible and avoids depending on whether the distribution
# happens to ship an unversioned `clang` on PATH (Fedora, for one, does not).
clang = "22.1.8"
# Only the benchmark needs this. The load generator is deliberately not written
# in Odin: a generator sharing the codec under test could agree with a bug in it.
go = "1.26.4"

[env]
ELODIN_SRC = "{{config_root}}/src"
ELODIN_OUT = "{{config_root}}/bin/elodin"

# The clang above is a conda-forge build, so out of the box it links against
# conda's own sysroot and libraries. elodin binds to the system OpenSSL, so the
# linker has to look at the system instead: `--sysroot=/` drops conda's root and
# `-B/usr/bin` selects the platform linker, whose default search paths then find
# libssl and libcrypto wherever the distribution keeps them. Nothing here names
# a library directory, so it holds across distributions.
ELODIN_LDFLAGS = "--sysroot=/ -B/usr/bin"

# Each worker thread keeps its own scratch arena, and Odin sizes those at 4 MB
# by default. A query needs a few kilobytes at most, so that costs ~4 MB per
# worker — half a gigabyte at the default worker count — for nothing. 256 KB
# measures identically on throughput and cuts resident memory by an order of
# magnitude; the arena still grows if a request ever needs more.
ELODIN_DEFINES = "-define:DEFAULT_TEMP_ALLOCATOR_BACKING_SIZE=262144"

# bin/ is not in version control, so a fresh clone has to create it before the
# linker is asked to write there.
[tasks.prepare]
hide = true
run = "mkdir -p bin"

[tasks.build]
description = "Build elodin (debug symbols, bounds checks on)"
depends = ["prepare"]
run = "odin build src/main -out:bin/elodin -collection:elodin=src -debug -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES"

[tasks.release]
description = "Build elodin optimised for speed"
depends = ["prepare"]
run = "odin build src/main -out:bin/elodin -collection:elodin=src -o:speed -disable-assert -no-bounds-check -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES"

[tasks.check]
description = "Type-check every package without emitting a binary"
run = "odin check src/main -collection:elodin=src -vet -strict-style"

[tasks.test]
description = "Run all unit tests"
depends = ["prepare"]
run = [
  "odin test src/dns      -collection:elodin=src -out:bin/test_dns -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES",
  "odin test src/yaml     -collection:elodin=src -out:bin/test_yaml -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES",
  "odin test src/config   -collection:elodin=src -out:bin/test_config -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES",
  "odin test src/filter   -collection:elodin=src -out:bin/test_filter -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES",
  "odin test src/privdrop -collection:elodin=src -out:bin/test_privdrop -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES",
  "odin test src/cache    -collection:elodin=src -out:bin/test_cache -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES",
  "odin test src/dnssec   -collection:elodin=src -out:bin/test_dnssec -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES",
  "odin test src/tlsx     -collection:elodin=src -out:bin/test_tlsx -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES",
  "odin test src/upstream -collection:elodin=src -out:bin/test_upstream -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES",
  "odin test src/h2       -collection:elodin=src -out:bin/test_h2 -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES",
  "odin test src/server   -collection:elodin=src -out:bin/test_server -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES",
]

[tasks.itest]
description = "Integration tests: run the built binary against mock upstreams"
depends = ["build", "prepare"]
run = "odin build src/itest -collection:elodin=src -out:bin/itest -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES && ./bin/itest"

[tasks.verify]
description = "Everything: type-check, unit tests, integration tests"
depends = ["check", "test", "itest"]
run = "echo 'all checks passed'"

[tasks.run]
description = "Run elodin locally on port 5354 (no root needed)"
depends = ["build", "prepare"]
run = "./bin/elodin --config examples/dev.yaml"

[tasks.certs]
description = "Generate a self-signed cert for local DoT/DoH testing"
# ECDSA rather than RSA: a TLS handshake costs the server about 1 ms of CPU with
# a P-256 key against 2 ms with RSA-2048, and handshakes dominate DoT/DoH cost
# whenever clients do not reuse connections.
run = """
mkdir -p certs
openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
  -keyout certs/key.pem -out certs/cert.pem \
  -days 825 -subj "/CN=elodin.local" \
  -addext "subjectAltName=DNS:elodin.local,DNS:localhost,IP:127.0.0.1"
"""

[tasks.bench]
description = "Measure throughput, latency, CPU and memory (see bench/README.md)"
depends = ["release"]
run = "cd bench && go run ./cmd/bench"

[tasks.clean]
description = "Remove build artefacts"
run = "rm -rf bin"
