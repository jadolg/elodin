[tools]
odin = "dev-2026-10"
# Odin shells out to `clang` as its linker driver. Pinning it here keeps the
# toolchain reproducible and avoids depending on whether the distribution
# happens to ship an unversioned `clang` on PATH (Fedora, for one, does not).
clang = "22.1.8"
# Only the benchmark and scripts/re2diff need this. The load generator is
# deliberately not written in Odin: a generator sharing the codec under test
# could agree with a bug in it.
go = "1.26.8"

[env]
ELODIN_SRC = "{{config_root}}/src"
ELODIN_OUT = "{{config_root}}/bin/elodin"

# The clang above is a conda-forge build, so out of the box it links against
# conda's own sysroot and libraries. elodin binds to the system OpenSSL, so the
# linker has to look at the system instead: `--sysroot=/` drops conda's root and
# `-B/usr/bin` selects the platform linker, whose default search paths then find
# libssl and libcrypto wherever the distribution keeps them. Nothing here names
# a library directory, so it holds across distributions.
ELODIN_LDFLAGS = "--sysroot=/ -B/usr/bin"

# The version the binary reports comes from git rather than a constant in the
# source, so a build cannot claim a release that was never tagged. A commit that
# carries a tag reports the tag; anything else reports dev-<short sha>, which is
# still enough to identify the build. ELODIN_VERSION in the environment wins, so
# release CI can name the tag it is publishing even from a checkout whose tags
# were never fetched, and a tree with no .git at all still builds.
ELODIN_VERSION = "{{ exec(command='echo ${ELODIN_VERSION:-$(git describe --tags --exact-match 2>/dev/null || echo dev-$(git rev-parse --short HEAD 2>/dev/null || echo unknown))}') }}"

# Each worker thread keeps its own scratch arena, and Odin sizes those at 4 MB
# by default. A query needs a few kilobytes at most, so that costs ~4 MB per
# worker — half a gigabyte at the default worker count — for nothing. 256 KB
# measures identically on throughput and cuts resident memory by an order of
# magnitude; the arena still grows if a request ever needs more.
ELODIN_DEFINES = "-define:DEFAULT_TEMP_ALLOCATOR_BACKING_SIZE=262144 -define:ELODIN_VERSION={{ env.ELODIN_VERSION }}"

# `odin test` already wraps each test in a tracking allocator and prints what it
# was still holding when it returned. It does not fail the run over it, though:
# the default is a warning line among the passes, which is a leak reported to
# nobody. This makes one an error, so a test that leaks fails like a test that
# asserts wrongly.
#
# Only meaningful to `odin test` - passing it to a build draws an unused-define
# warning - so it is kept apart from ELODIN_DEFINES rather than folded in.
#
# It covers what a test allocates and nothing else. Memory the running server
# owns - the configuration, a listener's TLS context, a race worker's answer -
# is reached by `mise run leakcheck` instead.
ELODIN_TEST_DEFINES = "-define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true"

# bin/ is not in version control, so a fresh clone has to create it before the
# linker is asked to write there.
[tasks.prepare]
hide = true
run = "mkdir -p bin"

[tasks.build]
description = "Build elodin (debug symbols, unoptimised)"
depends = ["prepare"]
run = "odin build src/main -out:bin/elodin -collection:elodin=src -debug -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES"

[tasks.release]
description = "Build elodin optimised for speed"
depends = ["prepare"]
# Bounds checks stay on. Every parser this binary runs — DNS wire, HPACK, YAML,
# HTTP/1.1 — reads bytes an attacker chose, and compiling the checks out is what
# turns a missed guard there into a write at an offset the peer picked rather
# than a crash. It has happened once already: a chunked size of sixteen `F`s
# wrapped to a negative int and asked the reader for a slice ending before it
# started. The cost of keeping them is 1-3% of CPU per query across every
# transport and 38 KB of binary, measured with `mise run bench -only cpu`.
run = "odin build src/main -out:bin/elodin -collection:elodin=src -o:speed -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES"

[tasks.deb]
description = "Build a .deb from the optimised binary (dist/)"
depends = ["release"]
run = "packaging/build-deb.sh"

[tasks.check]
description = "Type-check every package without emitting a binary"
run = "odin check src/main -collection:elodin=src -vet -strict-style"

# Odin has no -fsanitize=fuzzer of its own, so coverage instrumentation has to
# be added on the IR rather than by the Odin driver: `odin build` emits LLVM IR
# for the target package, and clang then instruments and links it into a
# libFuzzer binary. Build only — running is open-ended, so it is not part of
# `verify` and has no fixed exit condition to script here.
#
# `-sanitize:address` goes to odin, not only to clang: clang's ASan pass only
# instruments functions carrying the `sanitize_address` attribute, which a C
# front end adds and IR from odin does not. Without it ASan saw nothing but the
# libc calls, and a load from freed memory in Odin code replayed clean.
# `-Wno-backend-plugin` quiets clang noting, once per module, that it is
# already instrumented.
#
# Every directory under src/fuzz but the shared harness is a target, so a new one
# is built and replayed without being listed here. FUZZ_TARGETS narrows it to the
# ones named, which is how the nightly job builds only the target it runs.
[tasks.fuzz]
description = "Build every fuzz target in src/fuzz (bin/fuzz_*)"
depends = ["prepare"]
run = """
for t in ${FUZZ_TARGETS:-$(cd src/fuzz && ls -d */ | tr -d / | grep -vx harness)}; do
  rm -rf bin/fuzz-ir/$t && mkdir -p bin/fuzz-ir/$t &&
  odin build src/fuzz/$t -collection:elodin=src -build-mode:llvm-ir -no-entry-point -sanitize:address -out:bin/fuzz-ir/$t/ $ELODIN_DEFINES &&
  clang -fsanitize=fuzzer,address -Wno-override-module -Wno-backend-plugin -o bin/fuzz_$t bin/fuzz-ir/$t/*.ll $ELODIN_LDFLAGS -lssl -lcrypto -lm || exit 1
done
"""

# The fast, bounded shape of fuzzing that belongs in a PR: no new inputs are
# generated, each target just replays testdata/fuzz-corpus/ once. A crash that
# fuzzing found stays found instead of only living in whoever's corpus turned
# it up.
[tasks.fuzz-regression]
description = "Replay the committed fuzz corpus through each target once"
depends = ["fuzz"]
run = """
# A .max_len is only used nightly, so check here that each one names a target
# and parses, or a typo'd name or a bad line fuzzes at the default unnoticed.
for f in testdata/fuzz-corpus/*.max_len; do
  [ -e "$f" ] || continue
  t=$(basename "$f" .max_len)
  { [ -d "src/fuzz/$t" ] && [ "$t" != harness ]; } || { echo "$f: no fuzz target by that name" >&2; exit 1; }
  scripts/fuzz-max-len.sh "$t" >/dev/null || exit 1
done
for t in ${FUZZ_TARGETS:-$(cd src/fuzz && ls -d */ | tr -d / | grep -vx harness)}; do
  # Start a target with its cap and no corpus, so one that refuses it at start-up
  # (one feeding a socket, past MAX_FEED) fails here too. Only the targets just
  # built, so a stale binary never answers for the source.
  len=$(scripts/fuzz-max-len.sh "$t") || exit 1
  if [ -n "$len" ] && ! out=$(ASAN_OPTIONS=detect_leaks=0 ./bin/fuzz_$t $len -runs=0 2>&1); then
    printf '%s\\n' "$out" >&2; echo "bin/fuzz_$t fails to start with $len" >&2; exit 1
  fi
  # No -max_len on the replay: it truncates corpus files longer than the cap, and a
  # reproducer cut short no longer reproduces.
  ASAN_OPTIONS=detect_leaks=0 ./bin/fuzz_$t -runs=0 testdata/fuzz-corpus/$t || exit 1
done
"""

[tasks.test]
description = "Run all unit tests"
depends = ["prepare"]
run = [
  "odin test src/dns      -collection:elodin=src -out:bin/test_dns -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES $ELODIN_TEST_DEFINES",
  "odin test src/yaml     -collection:elodin=src -out:bin/test_yaml -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES $ELODIN_TEST_DEFINES",
  "odin test src/config   -collection:elodin=src -out:bin/test_config -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES $ELODIN_TEST_DEFINES",
  "odin test src/filter   -collection:elodin=src -out:bin/test_filter -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES $ELODIN_TEST_DEFINES",
  "odin test src/logx     -collection:elodin=src -out:bin/test_logx -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES $ELODIN_TEST_DEFINES",
  "odin test src/metrics  -collection:elodin=src -out:bin/test_metrics -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES $ELODIN_TEST_DEFINES",
  "odin test src/privdrop -collection:elodin=src -out:bin/test_privdrop -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES $ELODIN_TEST_DEFINES",
  "odin test src/cache    -collection:elodin=src -out:bin/test_cache -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES $ELODIN_TEST_DEFINES",
  "odin test src/dnssec   -collection:elodin=src -out:bin/test_dnssec -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES $ELODIN_TEST_DEFINES",
  "odin test src/tlsx     -collection:elodin=src -out:bin/test_tlsx -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES $ELODIN_TEST_DEFINES",
  "odin test src/upstream -collection:elodin=src -out:bin/test_upstream -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES $ELODIN_TEST_DEFINES",
  "odin test src/h2       -collection:elodin=src -out:bin/test_h2 -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES $ELODIN_TEST_DEFINES",
  "odin test src/server   -collection:elodin=src -out:bin/test_server -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES $ELODIN_TEST_DEFINES",
]

[tasks.itest]
description = "Integration tests: run the built binary against mock upstreams"
depends = ["build", "prepare"]
run = "odin build src/itest -collection:elodin=src -out:bin/itest -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES && ./bin/itest"

# Does the answer that reaches the client say what the upstream's answer said?
# A generator makes queries nobody wrote down and every field of every reply is
# held against the upstream's, so a record, an option or a flag that goes missing
# in the middle is caught without anyone having thought to check for it.
#
# Not part of `verify`: the default run takes about a minute, and the whole point
# of it is the long unattended run that finds what a short one does not. The
# short, bounded shape that belongs in a PR is `parity-regression`.
[tasks.parity]
description = "Compare elodin's answers against its upstream's, field by field"
depends = ["build", "prepare"]
run = [
  "odin build src/itest -collection:elodin=src -out:bin/itest -extra-linker-flags:\"$ELODIN_LDFLAGS\" $ELODIN_DEFINES",
  "./bin/itest --parity --parity-scenario all --parity-runs 2000",
]

# The seeds that have found something, replayed once each under every scenario.
# A divergence that was found stays found, the same way `fuzz-regression` keeps a
# crash found, and a seed found under one configuration is awkward traffic for
# all of them. Fast enough to gate a pull request.
[tasks.parity-regression]
description = "Replay the parity seeds that once diverged"
depends = ["build", "prepare"]
run = """
odin build src/itest -collection:elodin=src -out:bin/itest -extra-linker-flags:"$ELODIN_LDFLAGS" $ELODIN_DEFINES
status=0
while read -r seed _; do
  case "$seed" in ''|'#'*) continue ;; esac
  echo "parity seed $seed"
  ./bin/itest --parity --parity-scenario all --parity-seed "$seed" --parity-runs 400 || status=1
done < testdata/parity-seeds
exit $status
"""

[tasks.leakcheck]
description = "Run the integration suite against an AddressSanitizer build and fail on any finding"
depends = ["prepare"]
run = "scripts/leak-check.sh"

[tasks.verify]
description = "Everything: type-check, unit tests, integration tests"
depends = ["check", "test", "itest"]
run = "echo 'all checks passed'"

[tasks.run]
description = "Run elodin locally on port 5354 (no root needed)"
depends = ["build", "prepare"]
run = "./bin/elodin --config examples/dev.yaml"

[tasks.certs]
description = "Generate a self-signed cert for local DoT/DoH testing"
# ECDSA rather than RSA: a TLS handshake costs the server about 1 ms of CPU with
# a P-256 key against 2 ms with RSA-2048, and handshakes dominate DoT/DoH cost
# whenever clients do not reuse connections.
run = """
mkdir -p certs
openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
  -keyout certs/key.pem -out certs/cert.pem \
  -days 825 -subj "/CN=elodin.local" \
  -addext "subjectAltName=DNS:elodin.local,DNS:localhost,IP:127.0.0.1"
"""

# Does elodin read a `/regex/` rule as AdGuard Home does? Random patterns and
# query names go through urlfilter's own DNSEngine and through elodin, and a
# pattern elodin keeps must block exactly the names urlfilter blocks. In Go, as
# the benchmark is, since urlfilter is the reference. RE2DIFF_ARGS passes
# `-n`, `-seed` and `-v` through.
[tasks.re2-diff]
description = "Check regex rules against urlfilter, AdGuard Home's engine (scripts/re2diff)"
depends = ["prepare"]
run = "odin build scripts/re2diff/elodin -collection:elodin=src -out:bin/re2diff-elodin -extra-linker-flags:\"$ELODIN_LDFLAGS\" && cd scripts/re2diff && go run . -elodin ../../bin/re2diff-elodin ${RE2DIFF_ARGS:-}"

[tasks.bench]
description = "Measure throughput, latency, CPU and memory (see bench/README.md)"
depends = ["release"]
run = "cd bench && go run ./cmd/bench"

[tasks.clean]
description = "Remove build artefacts"
run = "rm -rf bin"
