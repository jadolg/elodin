version: 2
updates:
  # GitHub Actions used in workflows (.github/workflows/*.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Go modules used by the benchmarking tool (bench/go.mod)
  - package-ecosystem: "gomod"
    directory: "/bench"
    schedule:
      interval: "weekly"

  # The container image's pinned bases (packaging/Dockerfile): the distroless
  # runtime and the Debian it links in. Each bump goes through CI's image job;
  # .github/workflows/image-refresh.yml then rebuilds the published release on
  # it.
  - package-ecosystem: "docker"
    directory: "/packaging"
    schedule:
      interval: "weekly"
