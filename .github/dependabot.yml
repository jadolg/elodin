version: 2
updates:
  # GitHub Actions used in workflows (.github/workflows/*.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Go modules used by the benchmarking tool (bench/go.mod)
  - package-ecosystem: "gomod"
    directory: "/bench"
    schedule:
      interval: "weekly"

  # The container image's pinned images (Dockerfile): the distroless runtime,
  # the Debian elodin compiles in and the mise it compiles with. Each bump goes
  # through CI's image job; .github/workflows/image-refresh.yml then rebuilds
  # the published release on a moved base.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
