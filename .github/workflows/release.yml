name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build (linux-${{ matrix.arch }})
    # Each architecture builds natively on a runner of that architecture. The
    # alternative, cross-compiling from x86, would need an aarch64 sysroot
    # carrying glibc and OpenSSL, because src/tlsx and src/dnssec bind the
    # system libssl and libcrypto rather than vendoring them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/core-dumps
        with:
          mode: setup
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run release
        env:
          # The checkout is shallow and carries no tags, so leave the binary's
          # version to the tag the release is being published under.
          ELODIN_VERSION: ${{ github.event.release.tag_name }}

      # A tarball named for one architecture holding a binary for another is a
      # failure nobody notices until a user runs it, so check the ELF header
      # agrees with the matrix entry before packaging.
      - name: Verify binary architecture
        run: |
          case ${{ matrix.arch }} in
            amd64) expected=x86-64 ;;
            arm64) expected=aarch64 ;;
          esac
          file -b bin/elodin | grep -q "$expected" || {
            echo "expected $expected, got: $(file -b bin/elodin)" >&2
            exit 1
          }

      - name: Package
        run: packaging/build-tarball.sh elodin-${{ github.event.release.tag_name }}-linux-${{ matrix.arch }} bin/elodin

      # The same binary, packaged for the distributions that can install one.
      # Built after the tarball so both name the identical file.
      - name: Package .deb
        run: packaging/build-deb.sh ${{ github.event.release.tag_name }} ${{ matrix.arch }}

      # A package that installs on the runner is a weak test — it is the
      # distribution the binary was built on — but it is the one that catches
      # a broken maintainer script or an unsatisfiable dependency before a
      # user does, and it costs a few seconds.
      - name: Install the .deb
        run: |
          # Declining the takeover. Saying yes here would disable the runner's
          # resolver and put elodin on port 53 for the rest of the job, which
          # is not what the following steps are testing.
          echo 'elodin elodin/takeover-dns boolean false' | sudo debconf-set-selections
          sudo apt-get install -y ./dist/elodin_*_${{ matrix.arch }}.deb
          /usr/bin/elodin --version
          systemd-analyze verify /usr/lib/systemd/system/elodin.service
          sudo apt-get purge -y elodin

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            elodin-${{ github.event.release.tag_name }}-linux-${{ matrix.arch }}.tar.gz \
            dist/elodin_*_${{ matrix.arch }}.deb \
            --clobber
      - if: failure()
        uses: ./.github/actions/core-dumps
        with:
          mode: report
          name: release

  static:
    name: Build static (linux-${{ matrix.arch }})
    # One binary per architecture carrying musl and OpenSSL, for Alpine, OpenWrt
    # and any other Linux (see scripts/build-static.sh). Odin compiles on the
    # runner; the link happens in an Alpine container, so no OpenSSL headers
    # are needed here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/core-dumps
        with:
          mode: setup
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run release-static
        env:
          ELODIN_VERSION: ${{ github.event.release.tag_name }}

      # The architecture, as for the dynamic build, and that it is static: the
      # script refuses an interpreter or a NEEDED entry, and `file` says so too.
      - name: Verify binary architecture and linking
        run: |
          case ${{ matrix.arch }} in
            amd64) expected=x86-64 ;;
            arm64) expected=aarch64 ;;
          esac
          info=$(file -b bin/static/elodin)
          echo "$info"
          echo "$info" | grep -q "$expected" || { echo "expected $expected" >&2; exit 1; }
          echo "$info" | grep -q 'static-pie linked' || { echo "expected a static-pie binary" >&2; exit 1; }

      # It starts on the glibc runner and on musl, and says it is the static build.
      - name: Run it on glibc and on musl
        run: |
          bin/static/elodin --version | tee /dev/stderr | grep -q ', static)$'
          eval "$(mise env -s bash)"
          docker run --rm -v "$PWD/bin/static:/b:ro" "$ELODIN_ALPINE" /b/elodin --version | grep -q ', static)$'

      - name: Package
        run: packaging/build-tarball.sh elodin-${{ github.event.release.tag_name }}-linux-${{ matrix.arch }}-static bin/static/elodin

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            elodin-${{ github.event.release.tag_name }}-linux-${{ matrix.arch }}-static.tar.gz \
            --clobber
      - if: failure()
        uses: ./.github/actions/core-dumps
        with:
          mode: report
          name: release-static

  publish-deb:
    name: Publish deb to repository
    # Runs once, after every arch's .deb has landed in the release. Triggering
    # this per-matrix-job (as before) let a fast amd64 run kick off the deploy
    # before arm64 had uploaded its .deb, publishing a repo missing a package.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish deb to repository
        run: |
            curl --fail -H "Authorization: ${{ secrets.DEPLOY_TOKEN }}" "https://smd.akiel.dev/hook?script=${{ secrets.DEPLOY_SCRIPT }}"
