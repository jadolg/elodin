name: Refresh the container image

# The published image of the newest release, rebuilt on main's base pins when
# they have moved past the ones it was built on.
#
# The image's OpenSSL, glibc and CA bundle come from the distroless base, whose
# pin in the Dockerfile Dependabot moves when Google rebuilds it for a
# Debian security update. Without this, that fix would reach users only with
# the next elodin release. The release's own source is built - same elodin,
# same configuration - with main's image pins, and goes through the same checks
# and smoke test as a release before it replaces the tags.
#
# A release from before the image existed (no Dockerfile in its tree) has
# nothing to build it with and is left alone. One that has a Dockerfile and no
# image a day after it was published - its release job failed - gets one. Anything else the registry says
# fails the run, so that a refresh that cannot look is seen, not taken for
# "nothing to do".

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

jobs:
  decide:
    name: Is the newest release on main's base?
    # From main only: the signature names the ref the run came from, and
    # docs/install.md's `cosign verify` accepts a release tag or main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Whether the published image sits on the base main pins: the base's
      # layers are the image's first layers exactly when it was built on that
      # base. Read from the registry for linux/amd64; both architectures are
      # built from the one pin.
      - name: Compare the base layers
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          # The layers of `ref`'s linux/amd64 image, one digest a line.
          layers() {
            local raw repo d
            raw=$(docker buildx imagetools inspect --raw "$1") || return 1
            if jq -e '.manifests' <<<"$raw" >/dev/null; then
              repo=${1%@*}
              case ${repo##*/} in *:*) repo=${repo%:*} ;; esac
              d=$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest' <<<"$raw")
              raw=$(docker buildx imagetools inspect --raw "$repo@$d") || return 1
            fi
            jq -r '.layers[].digest' <<<"$raw"
          }
          set -o pipefail
          tag=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1000 --json tagName -q '.[].tagName' | sort -V | tail -1)
          [ -n "$tag" ] || { echo "no release" >&2; exit 1; }
          base=$(sed -nE 's/^FROM ([^ ]+@sha256:[0-9a-f]{64}) AS image$/\1/p' Dockerfile)
          [ -n "$base" ] || { echo "no pinned 'FROM ... AS image' in the Dockerfile" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git fetch --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
          if ! git cat-file -e "$tag:Dockerfile" 2>/dev/null; then
            echo "$tag predates the image; nothing to refresh"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          theirs=$(layers "$base")
          if ! ours=$(layers "$REPOSITORY:$tag" 2>"$RUNNER_TEMP/inspect.err"); then
            cat "$RUNNER_TEMP/inspect.err" >&2
            if grep -q ': not found' "$RUNNER_TEMP/inspect.err"; then
              # A release published in the last day may still have its own
              # run building the image; a build here would race it.
              published=$(gh release view "$tag" --json publishedAt -q .publishedAt)
              if [ "$(date -d "$published" +%s)" -gt "$(date -d '1 day ago' +%s)" ]; then
                echo "$tag has no image yet, and was published at $published; left to its release run"
                echo "stale=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "$tag has no image; building it"
              echo "stale=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "could not read $REPOSITORY:$tag" >&2
            exit 1
          fi
          if [ "$(head -n "$(wc -l <<<"$theirs")" <<<"$ours")" = "$theirs" ]; then
            echo "$tag is on $base"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag is not on $base"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    name: Rebuild ${{ needs.decide.outputs.tag }}
    needs: decide
    if: needs.decide.outputs.stale == 'true'
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ needs.decide.outputs.tag }}
      dockerfile-ref: ${{ github.sha }}
    permissions:
      contents: read
      packages: write
      id-token: write
