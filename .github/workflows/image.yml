name: Container image

# Build, check, push and sign the container image of one release, for amd64 and
# arm64. Called by release.yml when a release is published, and by
# image-refresh.yml to rebuild the newest release on a newer base.
#
# Each architecture builds natively on its own runner with
# docker/build-push-action - elodin compiles inside the build (see Dockerfile) -
# is run as a user would run it (scripts/image-smoke.sh), and only then is
# pushed: by digest, with no tag, carrying an SBOM and build provenance. The
# publish job joins the two digests under the release's tags once both exist,
# so a tag never names one architecture without the other and no per-arch tag
# is left behind, then signs the result with cosign (keyless, through this
# workflow's GitHub identity).

on:
  workflow_call:
    inputs:
      tag:
        description: the release whose source is built, and whose tag the image gets
        required: true
        type: string
      dockerfile-ref:
        description: a ref whose image pins (its `FROM ... AS <stage>` lines) replace those of the release's Dockerfile; empty keeps the release's
        required: false
        type: string
        default: ''

env:
  REPOSITORY: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build (linux-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      # Only the pins: each `FROM <image> AS <stage>` line of the release's
      # Dockerfile takes the image the ref names for that stage. The rest of
      # the build - stages, .dockerignore, mise.toml, source - stays the
      # release's, so a later change to how main builds cannot break the
      # rebuild of an older release, nor change what it holds.
      - name: Take the newer base pins
        if: inputs.dockerfile-ref != ''
        env:
          REF: ${{ inputs.dockerfile-ref }}
        run: |
          git fetch --depth 1 origin "$REF"
          git show FETCH_HEAD:Dockerfile |
            sed -nE 's/^FROM ([^ ]+) AS ([A-Za-z0-9_.-]+)$/\2 \1/p' > "$RUNNER_TEMP/pins"
          while read -r stage ref; do
            sed -i -E "s|^FROM [^ ]+ AS ${stage}\$|FROM ${ref} AS ${stage}|" Dockerfile
          done < "$RUNNER_TEMP/pins"
          git diff --stat -- Dockerfile
          grep '^FROM ' Dockerfile
      # The labels name the release's commit, not this workflow's, which for a
      # refresh is main's.
      - name: Describe the source
        id: src
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/core-dumps
        with:
          mode: setup
      - name: Install a DNS client
        run: sudo apt-get update && sudo apt-get install -y dnsutils
      # A docker-container builder: the attestations need one, and every build
      # below shares its cache, so the push sends the layers checked here.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: verify
          build-args: ELODIN_VERSION=${{ inputs.tag }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: image
          build-args: ELODIN_VERSION=${{ inputs.tag }}
          load: true
          tags: elodin:release

      # It says it is the release, and it resolves, validates, blocks, reloads
      # and stops, unprivileged on a read-only root. The full suite ran on the
      # release's commit in CI; this is the image about to be published.
      - name: Check the image
        run: |
          docker run --rm elodin:release --version | tee /dev/stderr | grep -q "^elodin $TAG "
          scripts/image-smoke.sh elodin:release

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: image
          build-args: ELODIN_VERSION=${{ inputs.tag }}
          labels: |
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ steps.src.outputs.revision }}
            org.opencontainers.image.created=${{ steps.src.outputs.created }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "${{ steps.push.outputs.digest }}" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          # Long enough to re-run a failed publish after a weekend.
          retention-days: 7
      # A core names its binary by the path inside the container, which the
      # report looks for on the runner, as in ci.yml's image job.
      - name: Put the binary where a core names it
        if: failure()
        run: |
          id=$(docker create elodin:release) || exit 0
          sudo docker cp "$id:/usr/bin/elodin" /usr/bin/elodin || true
          docker rm "$id" >/dev/null
      - if: failure()
        uses: ./.github/actions/core-dumps
        with:
          mode: report
          name: image

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    # One at a time per release: a refresh of a release whose own run is
    # publishing waits for it. Per release and not one group for all, since
    # GitHub keeps one pending run per group and cancels an older pending one,
    # which would drop a release's publish. Runs for different releases need no
    # order: a release is in the list the tags are chosen from from the moment
    # it is published, minutes before its own image is, and a run moves its
    # tags seconds after choosing them.
    concurrency:
      group: image-publish-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # The release's own tag always. `latest` only for the highest full
      # release, and the minor version (0.28) only for the highest full release
      # within it, so a fix published for an older line - or a refresh of one -
      # never moves either backwards.
      - name: Choose the tags
        id: tags
        run: |
          prerelease=$(gh release view "$TAG" -R "${{ github.repository }}" --json isPrerelease -q .isPrerelease)
          releases=$(gh release list -R "${{ github.repository }}" --exclude-pre-releases --exclude-drafts --limit 1000 --json tagName -q '.[].tagName')
          tags="$TAG"
          if [ "$prerelease" != true ]; then
            minor=${TAG%.*}
            if [ "$(grep -E "^${minor//./\\.}\.[0-9]+$" <<<"$releases" | sort -V | tail -1)" = "$TAG" ]; then
              tags="$tags $minor"
            fi
            if [ "$(sort -V <<<"$releases" | tail -1)" = "$TAG" ]; then
              tags="$tags latest"
            fi
          fi
          echo "tags=$tags" | tee -a "$GITHUB_OUTPUT"

      - name: Join the architectures under the tags
        id: join
        run: |
          args=()
          for t in ${{ steps.tags.outputs.tags }}; do args+=(-t "$REPOSITORY:$t"); done
          sources=()
          for f in "$RUNNER_TEMP"/digests/*; do sources+=("$REPOSITORY@$(cat "$f")"); done
          [ "${#sources[@]}" = 2 ] || { echo "expected two digests, got ${#sources[@]}" >&2; exit 1; }
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$REPOSITORY:$TAG" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" | tee -a "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$REPOSITORY:$TAG"

      # Keyless: the signature names this workflow run, which `cosign verify`
      # checks (see docs/install.md).
      - name: Sign
        run: cosign sign --yes "$REPOSITORY@${{ steps.join.outputs.digest }}"
