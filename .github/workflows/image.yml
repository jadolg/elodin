name: Container image

# Build, check, push and sign the container image of one release, for amd64 and
# arm64. Called by release.yml when a release is published, and by
# image-refresh.yml to rebuild the newest release on a newer base.
#
# Each architecture builds natively on its own runner (scripts/build-image.sh),
# is run as a user would run it (scripts/image-smoke.sh), and only then is
# pushed - by digest, with no tag, carrying an SBOM and build provenance. The
# publish job joins the two digests under the release's tags once both exist,
# so a tag never names one architecture without the other and no per-arch tag
# is left behind, then signs the result with cosign (keyless, through this
# workflow's GitHub identity).

on:
  workflow_call:
    inputs:
      tag:
        description: the release whose source is built, and whose tag the image gets
        required: true
        type: string
      dockerfile-ref:
        description: a ref whose packaging/Dockerfile replaces the release's own, for its newer base pins; empty keeps the release's
        required: false
        type: string
        default: ''

env:
  REPOSITORY: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build (linux-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      ELODIN_IMAGE: elodin:release
      ELODIN_VERSION: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Take the newer base pins
        if: inputs.dockerfile-ref != ''
        run: |
          git fetch --depth 1 origin "${{ inputs.dockerfile-ref }}"
          git checkout FETCH_HEAD -- packaging/Dockerfile
          grep '^FROM ' packaging/Dockerfile
      - uses: ./.github/actions/core-dumps
        with:
          mode: setup
      - name: Install a DNS client
        run: sudo apt-get update && sudo apt-get install -y dnsutils
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      # A docker-container builder: the SBOM and provenance attestations need
      # one, and the push below reuses its cache, so it sends the layers built
      # and checked here rather than building them again.
      - uses: docker/setup-buildx-action@v4
      - run: mise run image

      # It says it is the release, and it resolves, validates, blocks, reloads
      # and stops, unprivileged on a read-only root. The full suite ran on the
      # release's commit in CI; this is the image about to be published.
      - name: Check the image
        run: |
          docker run --rm "$ELODIN_IMAGE" --version | tee /dev/stderr | grep -q "^elodin $ELODIN_VERSION "
          scripts/image-smoke.sh "$ELODIN_IMAGE"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        run: |
          eval "$(mise env -s bash)"
          scripts/build-image.sh --push "$REPOSITORY"
          mkdir -p "$RUNNER_TEMP/digests"
          cp bin/image/digest "$RUNNER_TEMP/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          retention-days: 1
      - if: failure()
        uses: ./.github/actions/core-dumps
        with:
          mode: report
          name: image

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4

      # The release's own tag always. `latest` only for the highest full
      # release, and the minor version (0.28) only for the highest full release
      # within it, so a fix published for an older line - or a refresh of one -
      # never moves either backwards.
      - name: Choose the tags
        id: tags
        run: |
          prerelease=$(gh release view "$TAG" -R "${{ github.repository }}" --json isPrerelease -q .isPrerelease)
          releases=$(gh release list -R "${{ github.repository }}" --exclude-pre-releases --exclude-drafts --limit 1000 --json tagName -q '.[].tagName')
          tags="$TAG"
          if [ "$prerelease" != true ]; then
            minor=${TAG%.*}
            if [ "$(grep -E "^${minor//./\\.}\.[0-9]+$" <<<"$releases" | sort -V | tail -1)" = "$TAG" ]; then
              tags="$tags $minor"
            fi
            if [ "$(sort -V <<<"$releases" | tail -1)" = "$TAG" ]; then
              tags="$tags latest"
            fi
          fi
          echo "tags=$tags" | tee -a "$GITHUB_OUTPUT"

      - name: Join the architectures under the tags
        id: join
        run: |
          args=()
          for t in ${{ steps.tags.outputs.tags }}; do args+=(-t "$REPOSITORY:$t"); done
          sources=()
          for f in "$RUNNER_TEMP"/digests/*; do sources+=("$REPOSITORY@$(cat "$f")"); done
          [ "${#sources[@]}" = 2 ] || { echo "expected two digests, got ${#sources[@]}" >&2; exit 1; }
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$REPOSITORY:$TAG" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" | tee -a "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$REPOSITORY:$TAG"

      # Keyless: the signature names this workflow run, which `cosign verify`
      # checks (see docs/install.md).
      - name: Sign
        run: cosign sign --yes "$REPOSITORY@${{ steps.join.outputs.digest }}"
