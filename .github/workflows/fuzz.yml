name: Fuzz

# A per-PR run is the wrong shape for fuzzing: too slow to gate a merge on,
# and a few minutes per target finds little that a longer, unattended
# run would not. This runs on a schedule instead, with a corpus that persists
# across runs via actions/cache — restore-keys picks up the most recent
# corpus for a target so coverage compounds night over night rather than
# restarting from testdata/fuzz-corpus/ every time. workflow_dispatch is for
# running it on demand after touching a parser.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  # The matrix is every directory under src/fuzz but the shared harness, the
  # same listing `mise run fuzz` builds from, so a new target is fuzzed nightly
  # without anyone having to add it here.
  targets:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          list=$(cd src/fuzz && ls -d */ | tr -d / | grep -vx harness | jq -Rnc '[inputs]')
          echo "list=$list" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz (${{ matrix.target }})
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - run: mise run fuzz
        env:
          FUZZ_TARGETS: ${{ matrix.target }}

      # Cache key is unique per run so the save step always writes a new
      # entry; restore-keys then matches on the target-scoped prefix to pick
      # up the newest previous one. This is what makes the corpus grow
      # instead of resetting every night.
      - name: Restore corpus
        uses: actions/cache@v6
        with:
          path: corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Seed corpus from testdata/ on the first run
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cp -n testdata/fuzz-corpus/${{ matrix.target }}/* corpus/${{ matrix.target }}/ 2>/dev/null || true

      - name: Fuzz for 20 minutes
        run: |
          mkdir -p crashes
          dict=testdata/fuzz-corpus/${{ matrix.target }}.dict
          [ -f "$dict" ] || dict=""
          # A target's larger input cap, if it has one; see the script.
          len=$(scripts/fuzz-max-len.sh ${{ matrix.target }})
          ASAN_OPTIONS=detect_leaks=0 ./bin/fuzz_${{ matrix.target }} \
            ${dict:+-dict=$dict} \
            $len \
            -max_total_time=1200 \
            -artifact_prefix=crashes/ \
            corpus/${{ matrix.target }}

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: crashes/

  # Not a fuzzer, but the same shape: a long random run that finds what a gated
  # one would not. A regex rule elodin keeps must block exactly the names
  # urlfilter, AdGuard Home's engine, blocks; the seed is printed, so a red run
  # is reproduced with `RE2DIFF_ARGS="-seed N" mise run re2-diff`.
  re2diff:
    name: Regex rules against urlfilter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: mise run re2-diff
        env:
          RE2DIFF_ARGS: -n 2000000
