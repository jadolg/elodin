name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Style check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: mise run check

  test:
    name: Tests (${{ matrix.arch }})
    # Releases ship an arm64 tarball, so the tests have to run on arm64 too.
    # A release build is the wrong place to discover that the OpenSSL bindings
    # or the wire parsers only hold on x86.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: mise run test
      - run: mise run itest

  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: mise run build
