name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Style check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run check

  test:
    name: Tests (${{ matrix.arch }})
    # Releases ship an arm64 tarball, so the tests have to run on arm64 too.
    # A release build is the wrong place to discover that the OpenSSL bindings
    # or the wire parsers only hold on x86.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # strace: the log.file case counts the server's syncs with it.
      - name: Install OpenSSL headers and strace
        run: sudo apt-get update && sudo apt-get install -y libssl-dev strace
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run test
      - run: mise run itest

  leakcheck:
    name: Memory (AddressSanitizer)
    # The integration suite again, this time against a binary built with
    # -sanitize:address, so a leak or a use-after-free in the running server
    # fails the build.
    #
    # `mise run test` covers what a test allocates: the runner tracks it and,
    # since ODIN_TEST_FAIL_ON_BAD_MEMORY, fails on what is left over. What it
    # cannot see is memory the server itself owns — the configuration, a
    # listener's TLS context, the answer a race worker allocates on the heap
    # because it may outlive the caller's arena. Every one of those has leaked
    # at some point, and none of them is reachable from a unit test.
    #
    # One architecture is enough: nothing here is arch-specific, and the job
    # costs about two and a half minutes against the plain suite's one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # strace: the log.file case runs its server traced, with the leak check off.
      - name: Install OpenSSL headers and strace
        run: sudo apt-get update && sudo apt-get install -y libssl-dev strace
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run leakcheck

  fuzz-regression:
    name: Fuzz corpus regression
    # No new inputs, just every file in testdata/fuzz-corpus/ run once through
    # its target. Actual fuzzing runs on a schedule (fuzz.yml) — this job's
    # only job is making sure a crash that fuzzing already found stays found.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run fuzz-regression

  parity-regression:
    name: Parity seed regression
    # The seeds in testdata/parity-seeds, replayed against the synthetic
    # upstream. Fresh queries are generated nightly by parity.yml — this job's
    # only job is making sure a divergence that run already found stays found.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run parity-regression

  load:
    name: Load (${{ matrix.arch }})
    # The optimised binary under sustained load on every transport, on every
    # architecture a release ships for: a server that stops answering, leaks,
    # spins when idle or cannot stop fails here rather than in production. The
    # thresholds are loose on purpose (see scripts/load-smoke.sh).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSSL headers and jq
        run: sudo apt-get update && sudo apt-get install -y libssl-dev jq
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run load-smoke
        env:
          LOAD_WORK: ${{ runner.temp }}/load-smoke
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: load-smoke-${{ matrix.arch }}
          path: ${{ runner.temp }}/load-smoke

  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run build

  package:
    name: Package (${{ matrix.arch }})
    # Builds the .deb, installs it, and asks the installed service to resolve
    # something. The takeover is accepted rather than declined: port 53 on the
    # runner belongs to systemd-resolved, which is the machine the package is
    # written for, so this is the install path a real one takes rather than a
    # detour around the only interesting part of it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSSL headers and a DNS client
        run: sudo apt-get update && sudo apt-get install -y libssl-dev dnsutils
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      # The upstreams in the shipped configuration are DoT, so a runner that
      # cannot reach 853 would fail the queries below for a reason that has
      # nothing to do with the package. Finding that out here says which it is.
      - name: Check egress to a DoT upstream
        run: timeout 10 bash -c 'cat < /dev/null > /dev/tcp/1.1.1.1/853' && echo "853 reachable"

      - run: mise run deb

      # What the runner's resolver looked like before the package touched it,
      # so the check after removal compares against what was actually there
      # rather than against an assumption about how the image sets it up.
      - name: Record the runner's resolver
        run: |
          {
            stat -c '%F' /etc/resolv.conf
            readlink /etc/resolv.conf || echo "(not a symlink)"
            md5sum < /etc/resolv.conf
          } | tee /tmp/resolv-before

      # What already listens on port 53, with its process, which the postinst has
      # to clear before elodin can bind 0.0.0.0:53. Printed before the install:
      # after a failed one the postinst has put the previous resolver back.
      - name: What holds port 53
        run: |
          sudo ss -lntup 'sport = :53' || true
          systemctl list-sockets --all --no-pager | grep -E ':53\b' || true

      # Some arm64 images run their own DNS proxy, "dns-resolver" on
      # 127.0.0.100:53, which keeps elodin off 0.0.0.0:53 and fails the install
      # with Address_In_Use. It belongs to the image, not to the hosts the
      # postinst is written for, so it is stopped here and started again after
      # the removal. systemd-resolved is left alone: clearing it is the
      # postinst's job and what this job tests.
      - name: Stop the image's other port-53 holders
        run: |
          : > /tmp/port53-units
          for pid in $(sudo ss -Hlntup 'sport = :53' | grep -v '"systemd-resolve"' | grep -oP 'pid=\K[0-9]+' | sort -u); do
            unit=$(ps -o unit= -p "$pid" | tr -d ' ')
            ps -o pid=,unit=,args= -p "$pid"
            # Only a system service: stopping a scope would take its session.
            if [[ "$unit" != *.service ]]; then
              echo "pid $pid holds port 53 outside a service (unit: ${unit:-none})" >&2
              exit 1
            fi
            sudo systemctl stop "$unit"
            echo "$unit" >> /tmp/port53-units
          done
          ! sudo ss -Hlntup 'sport = :53' | grep -v '"systemd-resolve"'

      - name: Install it
        run: |
          echo 'elodin elodin/takeover-dns boolean true' | sudo debconf-set-selections
          sudo apt-get install -y ./dist/elodin_*_${{ matrix.arch }}.deb

      - name: The takeover happened
        run: |
          test "$(systemctl is-active elodin)" = active
          test "$(systemctl is-enabled elodin)" = enabled
          test "$(systemctl is-enabled systemd-resolved)" = masked
          grep -q '^nameserver 127\.0\.0\.1$' /etc/resolv.conf
          # Started once and stayed up, rather than looping behind a postinst
          # that only ever saw the exec succeed.
          test "$(systemctl show elodin -p NRestarts --value)" = 0

      - name: Resolve through the installed service
        run: |
          dig +short @127.0.0.1 example.com A | grep -qE '^[0-9]+\.'
          dig +short +tcp @127.0.0.1 example.org A | grep -qE '^[0-9]+\.'
          dig @127.0.0.1 cloudflare.com A +dnssec | grep -q 'flags:.* ad;'
          dig @127.0.0.1 doubleclick.net A | grep -q 'status: NXDOMAIN'
          # Not @127.0.0.1: this one goes through /etc/resolv.conf, so it only
          # answers if the takeover pointed the machine at elodin properly.
          getent hosts example.com

      # The postinst only says to look in the journal, and the runner is gone by
      # the time anyone reads that, so a failure prints it here.
      - name: The service's journal
        if: failure()
        run: sudo journalctl -u elodin --no-pager -o short-precise -n 300 || true

      # Runs even when something above failed, so the runner is never left
      # pointed at a resolver that is not answering.
      - name: Remove it, and check the runner got its resolver back
        if: always()
        run: |
          sudo apt-get remove -y elodin
          if [ -s /tmp/port53-units ]; then
            xargs -r sudo systemctl start < /tmp/port53-units
          fi
          test "$(systemctl is-active systemd-resolved)" = active
          {
            stat -c '%F' /etc/resolv.conf
            readlink /etc/resolv.conf || echo "(not a symlink)"
            md5sum < /etc/resolv.conf
          } > /tmp/resolv-after
          diff /tmp/resolv-before /tmp/resolv-after
          getent hosts example.com
