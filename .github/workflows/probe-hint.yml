name: Probe hint wiring
on: pull_request
jobs:
  mutant:
    strategy:
      fail-fast: false
      matrix:
        mutant: [none, never_in_force, never_stored, reads_always, reads_never]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run prepare
      - name: apply mutant
        env:
          MUTANT: ${{ matrix.mutant }}
        run: |
          python3 - <<'PY'
          import os
          p = 'src/sandbox/landlock.odin'
          s = open(p).read()
          m = os.environ['MUTANT']
          subs = {
            'none': [],
            'never_in_force': [('in_force = sync.atomic_load(&landlock_in_force)', 'in_force = false')],
            'never_stored': [('\tsync.atomic_store(&landlock_in_force, true)\n', '')],
            'reads_always': [('reads = sync.atomic_load(&landlock_reads)', 'reads = true')],
            'reads_never': [('reads = sync.atomic_load(&landlock_reads)', 'reads = false')],
          }[m]
          for a, b in subs:
              assert s.count(a) == 1, a
              s = s.replace(a, b)
          open(p, 'w').write(s)
          PY
          git diff
      - name: test
        run: |
          mise exec -- bash -c 'odin test src/sandbox -collection:elodin=src -out:bin/test_sandbox -define:ODIN_TEST_NAMES=sandbox.test_landlock_confines_writes_and_under_strict_reads -extra-linker-flags:"$ELODIN_LDFLAGS" $ELODIN_DEFINES $ELODIN_TEST_DEFINES' 2>&1 | tee out.txt
          if grep -q 'not available' out.txt; then echo "SKIPPED"; exit 2; fi
